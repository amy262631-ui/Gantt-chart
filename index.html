function doGet(e) {
  var action = e.parameter.action;
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  
  if (action === 'list') {
    var data = sheet.getDataRange().getValues();
    var result = {};
    // 從試算表中讀取 JSON 格式的專案資料
    for (var i = 0; i < data.length; i++) {
      if (data[i][0] && data[i][1]) {
        try {
          result[data[i][0]] = JSON.parse(data[i][1]);
        } catch(err) {}
      }
    }
    return ContentService.createTextOutput(JSON.stringify({data: result}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  var params = JSON.parse(e.postData.contents);
  var action = params.action;
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var data = sheet.getDataRange().getValues();
  
  if (action === 'save') {
    var projectId = params.id;
    var projectData = JSON.stringify(params.data);
    var found = false;
    
    // 尋找現有專案並更新，否則新增一行
    for (var i = 0; i < data.length; i++) {
      if (data[i][0] === projectId) {
        sheet.getRange(i + 1, 2).setValue(projectData);
        found = true;
        break;
      }
    }
    if (!found) {
      sheet.appendRow([projectId, projectData]);
    }
    return ContentService.createTextOutput("Success");
  }
  
  if (action === 'delete') {
    var projectId = params.id;
    for (var i = 0; i < data.length; i++) {
      if (data[i][0] === projectId) {
        sheet.deleteRow(i + 1);
        break;
      }
    }
    return ContentService.createTextOutput("Deleted");
  }
}

    }

    function loadSpecificProject(id) {
        activeProjectId = id;
        refreshUI();
    }

    async function addNewProjectPrompt() {
        const name = prompt("請輸入新工程名稱：", "新工程項目");
        if (!name) return;
        const newId = 'prj_' + Date.now();
        const data = { title: name, tasks: [], startDate: "", endDate: "" };
        if (!GAS_URL) { projectsMap[newId] = data; loadSpecificProject(newId); return; }
        await apiRequest('save', { id: newId, data: data }, false);
    }

    async function deleteCurrentProject() {
        if (!activeProjectId || !confirm("確定要刪除嗎？")) return;
        if (!GAS_URL) { delete projectsMap[activeProjectId]; activeProjectId = ''; updateSelectorUI(); return; }
        await apiRequest('delete', { id: activeProjectId }, false);
        activeProjectId = '';
    }

    function handleTitleUpdate() {
        const val = document.getElementById('projectName').value;
        document.getElementById('ganttDisplayTitle').textContent = val || "未命名工程";
        triggerCloudSave();
    }

    function refreshUI() {
        const data = projectsMap[activeProjectId];
        if (!data) return;
        document.getElementById('projectName').value = data.title || "";
        document.getElementById('ganttDisplayTitle').textContent = data.title || "未命名工程";
        document.getElementById('projStartInput').value = data.startDate || "";
        document.getElementById('projEndInput').value = data.endDate || "";
        const tbody = document.getElementById('taskBody');
        tbody.innerHTML = '';
        (data.tasks || []).forEach((t, i) => {
            tbody.insertAdjacentHTML('beforeend', createTaskRowHTML(t, i === 0));
        });
        renderGantt();
    }

    function createTaskRowHTML(t, isFirst) {
        const followChecked = t.follow ? 'checked' : '';
        const followToggle = isFirst ? '' : `<div style="font-size:11px; margin-top:4px;"><input type="checkbox" class="t-follow" ${followChecked} onchange="triggerCloudSave()"> 接續前項</div>`;
        return `<tr>
            <td><input type="text" class="t-name" value="${t.name || ''}" placeholder="工作項目..." oninput="triggerCloudSave()"></td>
            <td><input type="number" class="t-days" value="${t.days || 10}" oninput="triggerCloudSave()"></td>
            <td><input type="date" class="t-start" value="${t.start || ''}" oninput="triggerCloudSave()">${followToggle}</td>
            <td class="task-end-display"></td>
            <td>
                <select class="t-color" onchange="triggerCloudSave()">
                    <option value="#9b59b6" ${t.color==='#9b59b6'?'selected':''}>紫色</option>
                    <option value="#4A90E2" ${t.color==='#4A90E2'?'selected':''}>藍色</option>
                    <option value="#27ae60" ${t.color==='#27ae60'?'selected':''}>綠色</option>
                    <option value="#f39c12" ${t.color==='#f39c12'?'selected':''}>橘色</option>
                    <option value="#e74c3c" ${t.color==='#e74c3c'?'selected':''}>紅色</option>
                    <option value="#1abc9c" ${t.color==='#1abc9c'?'selected':''}>青色</option>
                    <option value="#fd79a8" ${t.color==='#fd79a8'?'selected':''}>粉色</option>
                    <option value="#2c3e50" ${t.color==='#2c3e50'?'selected':''}>深色</option>
                </select>
            </td>
            <td>
                <button class="btn btn-primary btn-small" onclick="insertTaskRow(this)">插入</button>
                <button class="btn btn-danger btn-small" onclick="removeTaskRow(this)">刪除</button>
            </td>
        </tr>`;
    }

    function addTaskRow() { document.getElementById('taskBody').insertAdjacentHTML('beforeend', createTaskRowHTML({}, false)); triggerCloudSave(); }
    function insertTaskRow(btn) { btn.closest('tr').insertAdjacentHTML('beforebegin', createTaskRowHTML({}, false)); triggerCloudSave(); }
    function removeTaskRow(btn) { btn.closest('tr').remove(); triggerCloudSave(); }

    function triggerCloudSave() {
        const rows = document.querySelectorAll('#taskBody tr');
        const tasks = [];
        rows.forEach(r => {
            tasks.push({
                name: r.querySelector('.t-name').value,
                days: parseInt(r.querySelector('.t-days').value) || 0,
                start: r.querySelector('.t-start').value,
                follow: r.querySelector('.t-follow')?.checked || false,
                color: r.querySelector('.t-color').value
            });
        });
        const updatedData = {
            title: document.getElementById('projectName').value,
            startDate: document.getElementById('projStartInput').value,
            endDate: document.getElementById('projEndInput').value,
            tasks: tasks
        };
        projectsMap[activeProjectId] = updatedData;
        renderGantt();
        if (!GAS_URL) return;
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => { apiRequest('save', { id: activeProjectId, data: updatedData }, true); }, 2500);
    }

    function renderGantt() {
        const rows = document.querySelectorAll('#taskBody tr');
        const sidebarList = document.getElementById('sidebarList');
        const barsArea = document.getElementById('taskBarArea');
        const axis = document.getElementById('timeAxis');
        
        sidebarList.innerHTML = '';
        barsArea.innerHTML = '';
        axis.innerHTML = '';

        let tasksData = [];
        let datesPool = [];
        let prevTaskEnd = null;

        const pStartStr = document.getElementById('projStartInput').value;
        const pEndStr = document.getElementById('projEndInput').value;
        if (pStartStr && pEndStr) {
            const start = new Date(pStartStr);
            const end = new Date(pEndStr);
            const diff = Math.ceil((end - start) / 86400000);
            document.getElementById('totalDaysDisplay').textContent = diff >= 0 ? diff : 0;
            datesPool.push(start, end);
        } else document.getElementById('totalDaysDisplay').textContent = 0;

        rows.forEach((row) => {
            const n = row.querySelector('.t-name').value;
            const d = parseInt(row.querySelector('.t-days').value) || 0;
            const sInp = row.querySelector('.t-start');
            const follow = row.querySelector('.t-follow')?.checked || false;
            const color = row.querySelector('.t-color').value;

            if (follow && prevTaskEnd) {
                const nextS = new Date(prevTaskEnd);
                nextS.setDate(nextS.getDate() + 1);
                sInp.value = nextS.toISOString().split('T')[0];
                sInp.readOnly = true;
                sInp.style.backgroundColor = "#f1f3f5";
            } else {
                sInp.readOnly = false;
                sInp.style.backgroundColor = "";
            }

            if (sInp.value) {
                const start = new Date(sInp.value);
                const end = new Date(start);
                end.setDate(start.getDate() + d);
                row.querySelector('.task-end-display').textContent = end.toISOString().split('T')[0].replace(/-/g, '/');
                tasksData.push({ name: n, start, end, days: d, color });
                datesPool.push(start, end);
                prevTaskEnd = end;
            }
        });

        if (!datesPool.length) return;

        const minD = new Date(Math.min(...datesPool)); minD.setDate(1); minD.setDate(minD.getDate() - 5);
        const maxD = new Date(Math.max(...datesPool)); maxD.setDate(maxD.getDate() + 15);
        const totalDays = Math.ceil((maxD - minD) / 86400000);
        const totalW = totalDays * pxPerDay;

        document.getElementById('ganttChartBody').style.width = totalW + 'px';
        axis.style.width = totalW + 'px';
        document.getElementById('ganttGrid').style.backgroundSize = `${pxPerDay}px 100%`;

        for (let i = 0; i <= totalDays; i++) {
            const cur = new Date(minD); cur.setDate(cur.getDate() + i);
            if (cur.getDate() === 1) {
                const ml = document.createElement('div'); ml.className = 'month-marker';
                ml.style.left = (i * pxPerDay) + 'px'; ml.innerText = `${cur.getFullYear()}/${cur.getMonth()+1}`;
                axis.appendChild(ml);
            }
            if (cur.getDate() === 1 || cur.getDate() === 15) {
                const dl = document.createElement('div'); dl.className = 'day-marker';
                dl.style.left = (i * pxPerDay) + 'px'; dl.innerText = cur.getDate();
                axis.appendChild(dl);
            }
        }

        tasksData.forEach(t => {
            const si = document.createElement('div'); si.className = 'sidebar-task-item'; si.textContent = t.name;
            sidebarList.appendChild(si);
            const row = document.createElement('div'); row.className = 'gantt-row';
            const offset = Math.ceil((t.start - minD) / 86400000);
            const bar = document.createElement('div'); bar.className = 'task-bar';
            bar.style.left = (offset * pxPerDay) + 'px';
            bar.style.width = (t.days * pxPerDay) + 'px';
            bar.style.backgroundColor = t.color;
            bar.textContent = t.days + '天';
            row.appendChild(bar);
            barsArea.appendChild(row);
        });
    }

    async function exportFile(type) {
        const target = document.getElementById('captureArea');
        const scroll = document.getElementById('scrollArea');
        const fullW = target.offsetWidth - scroll.offsetWidth + scroll.scrollWidth;
        try {
            const canvas = await html2canvas(target, {
                scale: 2, useCORS: true, backgroundColor: "#ffffff",
                width: fullW, windowWidth: fullW,
                onclone: (cloned) => {
                    const cS = cloned.getElementById('scrollArea');
                    cS.style.width = scroll.scrollWidth + "px";
                    cS.style.overflow = "visible";
                }
            });
            if (type === 'jpg') {
                const link = document.createElement('a');
                link.download = `${document.getElementById('projectName').value || '工程甘特圖'}.jpg`;
                link.href = canvas.toDataURL("image/jpeg", 0.9);
                link.click();
            } else {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [canvas.width/2, canvas.height/2] });
                pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, canvas.width/2, canvas.height/2);
                pdf.save(`${document.getElementById('projectName').value || '工程甘特圖'}.pdf`);
            }
        } catch (e) { console.error(e); }
    }
    function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }
    function updateStatus(text) { document.getElementById('statusMsg').innerText = text; }
</script>
</body>
</html>
