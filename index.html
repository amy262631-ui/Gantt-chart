<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工程甘特圖管理系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --sidebar-w: 180px;
  --header-h: 90px;
  --px-day: 2.4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft JhengHei", system-ui, sans-serif; background: #f4f6f8; color: #2d3436; font-size: 14px; }

/* ── 載入遮罩 ── */
#loader { position: fixed; inset: 0; background: rgba(255,255,255,.92); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
.spinner { width: 44px; height: 44px; border: 4px solid #e0e0e0; border-top-color: #4A90E2; border-radius: 50%; animation: spin .9s linear infinite; margin-bottom: 14px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 頂部欄 ── */
.app-header { background: #2c3e50; color: white; padding: 0 20px; height: 52px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.app-header h1 { font-size: 1.1rem; font-weight: 500; }
.header-btns { display: flex; gap: 8px; }

/* ── 工程選擇列 ── */
.proj-bar { background: white; border-bottom: 1px solid #dde; padding: 10px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.proj-bar select { padding: 6px 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; min-width: 200px; }
.status-msg { font-size: 12px; color: #4A90E2; margin-left: auto; height: 18px; font-weight: 500; }

/* ── 主內容 ── */
.main { padding: 18px 20px; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* ── 模式選擇畫面 ── */
.mode-pick-screen { background: white; border-radius: 10px; border: 1px solid #e0e0e0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.mode-pick-screen h2 { font-size: 1.2rem; font-weight: 500; color: #2d3436; }
.mode-pick-screen p { font-size: 13px; color: #636e72; }
.mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 500px; }
.mode-card { border: 2px solid #e0e0e0; border-radius: 12px; padding: 24px 16px; cursor: pointer; text-align: center; background: white; transition: border-color .15s, background .15s; }
.mode-card:hover { border-color: #4A90E2; background: #f0f7ff; }
.mode-card .mc-icon { font-size: 32px; margin-bottom: 10px; }
.mode-card .mc-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.mode-card .mc-desc { font-size: 12px; color: #636e72; line-height: 1.6; }

/* ── 編輯卡片 ── */
.card { background: white; border-radius: 10px; border: 1px solid #e0e0e0; padding: 18px 20px; box-shadow: 0 2px 6px rgba(0,0,0,.04); }
.card-title { font-size: 13px; font-weight: 600; color: #636e72; margin-bottom: 12px; }

/* ── 工程標題列 ── */
.proj-info-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.proj-name-inp { font-size: 1.3rem; font-weight: 700; padding: 8px 12px; border: 2px solid #fab005; border-radius: 8px; background: #fff9db; color: #2c3e50; flex: 1; min-width: 200px; }
.mode-badge { font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
.badge-days { background: #ebf8ee; color: #1e8449; border: 1px solid #a9dfbf; }
.badge-date { background: #eaf3fb; color: #1a5276; border: 1px solid #aed6f1; }
.switch-mode-btn { font-size: 12px; padding: 4px 10px; border: 1px solid #ced4da; border-radius: 6px; background: white; cursor: pointer; color: #636e72; }
.switch-mode-btn:hover { background: #f4f6f8; }

/* ── 統計欄 ── */
.summary-bar { background: #fff9db; border: 1px solid #fce08a; border-radius: 8px; padding: 10px 16px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.summary-bar b { color: #e17055; font-size: 1.05rem; }
.summary-bar input[type=date] { padding: 4px 8px; border: 1px solid #fce08a; border-radius: 6px; background: white; font-size: 13px; font-weight: 600; }

/* ── 工作項目表格 ── */
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid #e0e0e0; padding: 8px 10px; text-align: center; vertical-align: middle; }
th { background: #f4f6f8; font-size: 12px; color: #636e72; font-weight: 600; white-space: nowrap; }
td:first-child { text-align: left; }
input[type=text], input[type=number], input[type=date], select {
  padding: 5px 8px; border: 1px solid #ced4da; border-radius: 5px; font-size: 13px; width: 100%; background: white; color: #2d3436;
}
input[readonly] { background: #f4f6f8; color: #9e9e9e; }
.end-disp { font-size: 12px; color: #636e72; white-space: nowrap; }
.follow-label { font-size: 11px; color: #636e72; display: flex; align-items: center; gap: 3px; margin-top: 3px; white-space: nowrap; }
.follow-label input[type=checkbox] { width: auto; }

/* ── 按鈕 ── */
.btn { border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.btn-blue { background: #4A90E2; color: white; }
.btn-blue:hover { background: #357abd; }
.btn-green { background: #27ae60; color: white; }
.btn-green:hover { background: #1e8449; }
.btn-red { background: #e74c3c; color: white; }
.btn-red:hover { background: #c0392b; }
.btn-dark { background: #2d3436; color: white; }
.btn-dark:hover { background: #1a1f20; }
.btn-sm { padding: 4px 9px; font-size: 12px; }
.btn-ghost { background: white; border: 1px dashed #ced4da; color: #636e72; width: 100%; justify-content: center; margin-top: 8px; }
.btn-ghost:hover { background: #f4f6f8; }

/* ── 顏色選擇 ── */
.color-swatch { width: 20px; height: 20px; border-radius: 50%; display: inline-block; vertical-align: middle; border: 2px solid rgba(0,0,0,.12); }
.color-select-wrap { display: flex; align-items: center; gap: 6px; }
.color-select-wrap select { width: auto; }

/* ── 甘特圖 ── */
#captureArea { background: white; border-radius: 10px; border: 1px solid #e0e0e0; overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.06); }
.gantt-section { display: flex; }
.gantt-sidebar { width: var(--sidebar-w); flex-shrink: 0; border-right: 2px solid #2d3436; background: #f8f9fa; }
.gantt-sidebar-hd { height: var(--header-h); background: #e9ecef; border-bottom: 2px solid #2d3436; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; text-align: center; }
.gantt-proj-name { font-weight: 700; font-size: 13px; color: #e67e22; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gantt-scroll { flex: 1; overflow-x: auto; }
.gantt-timeline { height: var(--header-h); position: relative; border-bottom: 2px solid #333; background: white; }
.month-mark { position: absolute; top: 10px; border-left: 2px solid #adb5bd; padding-left: 5px; font-weight: 700; font-size: 13px; color: #212529; white-space: nowrap; }
.day-mark { position: absolute; bottom: 7px; font-size: 10px; color: #868e96; }
/* 純天數模式時間軸 */
.pct-mark { position: absolute; top: 50%; transform: translateY(-50%); font-size: 11px; color: #636e72; border-left: 1px solid #ced4da; padding-left: 4px; white-space: nowrap; }
.gantt-body { position: relative; background: white; }
.gantt-row { height: 42px; border-bottom: 1px solid #f1f3f5; position: relative; }
.sidebar-item { height: 42px; display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid #f1f3f5; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-bar { position: absolute; height: 26px; top: 8px; border-radius: 13px; color: white; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 6px rgba(0,0,0,.15); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; z-index: 2; }
.gantt-grid-bg { position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(to right, #f1f3f5 1px, transparent 1px); }
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div><span id="loaderText">載入中...</span></div>

<header class="app-header">
  <h1>🏗️ 工程甘特圖管理系統</h1>
  <div class="header-btns">
    <button class="btn btn-dark" onclick="exportFile('jpg')">🖼️ 匯出 JPG</button>
    <button class="btn btn-dark" onclick="exportFile('pdf')">📄 匯出 PDF</button>
  </div>
</header>

<!-- 工程選擇列 -->
<div class="proj-bar">
  <strong>工程切換：</strong>
  <select id="projSelect" onchange="loadProject(this.value)"></select>
  <button class="btn btn-green" onclick="newProject()">＋ 新增工程</button>
  <button class="btn btn-red btn-sm" onclick="deleteProject()">🗑️ 刪除</button>
  <span id="statusMsg" class="status-msg"></span>
</div>

<div class="main" id="mainArea"></div>

<script>
/* ──────────────────────────────
   ★ 請填入你的 Apps Script 網址
   ────────────────────────────── */
const GAS_URL = "https://script.google.com/macros/s/AKfycbyc86jVGmXMzXBeh9BFD-VcGV-bGFDjZhAu3F5A4L_gU-1xRkb4cpth-Sy8Idoq7gINtA/exec";

const PALETTE = ['#4A90E2','#27ae60','#9b59b6','#f39c12','#e74c3c','#1abc9c','#fd79a8','#2c3e50','#00b894','#6c5ce7'];
const COLOR_NAMES = {'#4A90E2':'藍','#27ae60':'綠','#9b59b6':'紫','#f39c12':'橘','#e74c3c':'紅','#1abc9c':'青','#fd79a8':'粉','#2c3e50':'深','#00b894':'翠','#6c5ce7':'靛'};

let projects = {};
let activeId = '';
let saveTimer = null;

/* ── 初始化 ── */
window.onload = () => fetchAll(true);

/* ── API ── */
async function fetchAll(showLoad = false) {
  if (showLoad) showLoader(true, '讀取雲端資料...');
  try {
    const res = await fetch(`${GAS_URL}?action=list`);
    const json = await res.json();
    projects = json.data || {};
    updateSelector();
    const keys = Object.keys(projects);
    if (!activeId || !projects[activeId]) {
      activeId = keys.length ? keys[0] : '';
    }
    renderMain();
  } catch(e) { setStatus('❌ 無法連線'); }
  finally { if (showLoad) showLoader(false); }
}

async function apiSave(id, data, silent = false) {
  if (!silent) showLoader(true, '儲存中...');
  else setStatus('雲端同步中...');
  try {
    await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'save', id, data }) });
    setStatus('✅ 已同步'); setTimeout(() => setStatus(''), 3000);
  } catch(e) { setStatus('❌ 同步失敗'); }
  finally { if (!silent) showLoader(false); }
}

async function apiDelete(id) {
  showLoader(true, '刪除中...');
  try {
    await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'delete', id }) });
    await fetchAll(false);
  } catch(e) { setStatus('❌ 刪除失敗'); }
  finally { showLoader(false); }
}

/* ── 工程管理 ── */
function newProject() {
  const name = prompt('請輸入工程名稱：', '新工程');
  if (!name || !name.trim()) return;
  const id = 'prj_' + Date.now();
  projects[id] = { name: name.trim(), mode: null, startDate: '', tasks: [] };
  activeId = id;
  updateSelector();
  renderMain();
  scheduleSave();
}

function loadProject(id) {
  activeId = id;
  renderMain();
}

function deleteProject() {
  if (!activeId) return;
  if (!confirm('確定刪除此工程？')) return;
  apiDelete(activeId);
  delete projects[activeId];
  const keys = Object.keys(projects);
  activeId = keys.length ? keys[0] : '';
  updateSelector();
  renderMain();
}

function setMode(m) {
  if (!activeId) return;
  const proj = projects[activeId];
  proj.mode = m;
  if (!proj.tasks.length) {
    proj.tasks = [{ name: '工作項目一', days: 7, color: PALETTE[0], start: '', follow: false }];
  }
  renderMain();
  scheduleSave();
}

function switchMode() {
  if (!confirm('切換模式會清除日期資料，確定繼續？')) return;
  const proj = projects[activeId];
  proj.mode = null;
  proj.startDate = '';
  proj.tasks.forEach(t => { t.start = ''; t.follow = false; });
  renderMain();
  scheduleSave();
}

/* ── 即時儲存 ── */
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (activeId && projects[activeId]) apiSave(activeId, projects[activeId], true);
  }, 2000);
}

function onChange() {
  collectFromDOM();
  renderGantt();
  updateSummary();
  scheduleSave();
}

/* ── 從 DOM 收集資料 ── */
function collectFromDOM() {
  const proj = projects[activeId];
  if (!proj) return;
  const nameEl = document.getElementById('projNameInp');
  if (nameEl) { proj.name = nameEl.value; updateSelector(); }
  const startEl = document.getElementById('projStartInp');
  if (startEl) proj.startDate = startEl.value;
  const endEl = document.getElementById('projEndInp');
  if (endEl) proj.endDate = endEl.value;

  const rows = document.querySelectorAll('#taskBody tr');
  proj.tasks = [];
  rows.forEach(r => {
    proj.tasks.push({
      name:   r.querySelector('.t-name')?.value || '',
      days:   parseInt(r.querySelector('.t-days')?.value) || 1,
      start:  r.querySelector('.t-start')?.value || '',
      follow: r.querySelector('.t-follow')?.checked || false,
      color:  r.querySelector('.t-color')?.value || PALETTE[0],
    });
  });
}

/* ── 渲染主畫面 ── */
function renderMain() {
  const area = document.getElementById('mainArea');
  if (!activeId || !projects[activeId]) {
    area.innerHTML = '<div style="text-align:center;padding:60px;color:#9e9e9e">請先新增一個工程</div>';
    return;
  }
  const proj = projects[activeId];
  if (!proj.mode) { renderModePick(area, proj); return; }
  renderEditor(area, proj);
}

function renderModePick(area, proj) {
  area.innerHTML = `
    <div class="mode-pick-screen">
      <h2>「${esc(proj.name)}」— 請選擇甘特圖模式</h2>
      <p>選擇後仍可隨時切換</p>
      <div class="mode-cards">
        <div class="mode-card" onclick="setMode('days')">
          <div class="mc-icon">📊</div>
          <div class="mc-title">純天數模式</div>
          <div class="mc-desc">只填各項工期天數<br>不需要實際日期<br>適合估算、規劃階段</div>
        </div>
        <div class="mode-card" onclick="setMode('date')">
          <div class="mc-icon">📅</div>
          <div class="mc-title">日期模式</div>
          <div class="mc-desc">填入開始日期<br>各工項自動推算日期<br>適合實際排程追蹤</div>
        </div>
      </div>
    </div>`;
}

function renderEditor(area, proj) {
  const isDate = proj.mode === 'date';
  const dateCol = isDate
    ? `<th style="width:16%">起始日期</th><th style="width:11%">完成日期</th>`
    : '';

  area.innerHTML = `
    <!-- 工程資訊 -->
    <div class="card">
      <div class="proj-info-row">
        <input id="projNameInp" class="proj-name-inp" type="text" value="${esc(proj.name)}" oninput="onChange()">
        <span class="mode-badge ${isDate ? 'badge-date' : 'badge-days'}">${isDate ? '📅 日期模式' : '📊 純天數模式'}</span>
        <button class="switch-mode-btn" onclick="switchMode()">切換模式</button>
      </div>
    </div>

    <!-- 統計看板 -->
    <div id="summaryBar" class="summary-bar"></div>

    <!-- 工作項目表格 -->
    <div class="card">
      <div class="card-title">工作項目清單</div>
      <table>
        <thead><tr>
          <th style="width:28%;text-align:left">工作項目名稱</th>
          <th style="width:9%">天數</th>
          ${dateCol}
          <th style="width:10%">顏色</th>
          <th style="width:14%">操作</th>
        </tr></thead>
        <tbody id="taskBody"></tbody>
      </table>
      <button class="btn btn-ghost" onclick="addTask()">＋ 新增工作項目</button>
    </div>

    <!-- 甘特圖 -->
    <div id="captureArea">
      <div class="gantt-section">
        <div class="gantt-sidebar">
          <div class="gantt-sidebar-hd">
            <div id="ganttTitle" class="gantt-proj-name">${esc(proj.name)}</div>
            <div style="font-size:11px;color:#636e72;margin-top:4px">工作清單</div>
          </div>
          <div id="sidebarList"></div>
        </div>
        <div class="gantt-scroll" id="ganttScroll">
          <div id="ganttTimeline" class="gantt-timeline"></div>
          <div id="ganttBody" class="gantt-body">
            <div class="gantt-grid-bg" id="ganttGrid"></div>
            <div id="ganttBars"></div>
          </div>
        </div>
      </div>
    </div>`;

  renderTaskRows(proj);
  renderGantt();
  updateSummary();
}

/* ── 渲染工作列 ── */
function renderTaskRows(proj) {
  const isDate = proj.mode === 'date';
  const tbody = document.getElementById('taskBody');
  if (!tbody) return;
  tbody.innerHTML = '';
  proj.tasks.forEach((t, i) => {
    tbody.insertAdjacentHTML('beforeend', makeTaskRow(t, i, isDate, proj));
  });
}

function makeTaskRow(t, i, isDate, proj) {
  const colorOpts = PALETTE.map(c =>
    `<option value="${c}" ${t.color === c ? 'selected' : ''}>${COLOR_NAMES[c] || c}</option>`
  ).join('');

  let dateCell = '';
  if (isDate) {
    const followToggle = i === 0 ? '' :
      `<label class="follow-label"><input type="checkbox" class="t-follow" ${t.follow ? 'checked' : ''} onchange="onChange()"> 接續前項</label>`;
    dateCell = `
      <td>
        <input type="date" class="t-start" value="${t.start || ''}" ${t.follow && i > 0 ? 'readonly' : ''} oninput="onChange()">
        ${followToggle}
      </td>
      <td><span class="end-disp t-end">—</span></td>`;
  }

  return `<tr>
    <td><input type="text" class="t-name" value="${esc(t.name)}" placeholder="工作項目名稱" oninput="onChange()"></td>
    <td><input type="number" class="t-days" value="${t.days || 7}" min="1" style="width:65px" oninput="onChange()"></td>
    ${dateCell}
    <td>
      <div class="color-select-wrap">
        <select class="t-color" onchange="onChange()"><option disabled>選色</option>${colorOpts}</select>
        <span class="color-swatch" style="background:${t.color}"></span>
      </div>
    </td>
    <td style="white-space:nowrap">
      <button class="btn btn-blue btn-sm" onclick="insertTask(${i})">插入</button>
      <button class="btn btn-red btn-sm" onclick="removeTask(${i})">刪除</button>
    </td>
  </tr>`;
}

function addTask() {
  collectFromDOM();
  const proj = projects[activeId];
  proj.tasks.push({ name: '新工作項目', days: 7, color: PALETTE[proj.tasks.length % PALETTE.length], start: '', follow: false });
  renderTaskRows(proj);
  renderGantt();
  updateSummary();
  scheduleSave();
}

function insertTask(i) {
  collectFromDOM();
  const proj = projects[activeId];
  proj.tasks.splice(i, 0, { name: '新工作項目', days: 5, color: PALETTE[i % PALETTE.length], start: '', follow: false });
  renderTaskRows(proj);
  renderGantt();
  updateSummary();
  scheduleSave();
}

function removeTask(i) {
  collectFromDOM();
  const proj = projects[activeId];
  proj.tasks.splice(i, 1);
  renderTaskRows(proj);
  renderGantt();
  updateSummary();
  scheduleSave();
}

/* ── 甘特圖渲染 ── */
function renderGantt() {
  const proj = projects[activeId];
  if (!proj) return;
  const isDate = proj.mode === 'date';

  const sidebar = document.getElementById('sidebarList');
  const barsArea = document.getElementById('ganttBars');
  const timeline = document.getElementById('ganttTimeline');
  const ganttBody = document.getElementById('ganttBody');
  const ganttTitle = document.getElementById('ganttTitle');
  if (!sidebar || !barsArea || !timeline) return;

  if (ganttTitle) ganttTitle.textContent = proj.name || '未命名工程';
  sidebar.innerHTML = '';
  barsArea.innerHTML = '';
  timeline.innerHTML = '';

  const rows = document.querySelectorAll('#taskBody tr');
  const tasks = [];
  let prevEnd = null;

  rows.forEach((row, i) => {
    const name = row.querySelector('.t-name')?.value || '';
    const days = parseInt(row.querySelector('.t-days')?.value) || 1;
    const color = row.querySelector('.t-color')?.value || PALETTE[0];
    const followEl = row.querySelector('.t-follow');
    const follow = followEl ? followEl.checked : false;
    const startInp = row.querySelector('.t-start');

    if (isDate) {
      if (follow && prevEnd && i > 0) {
        const ns = new Date(prevEnd); ns.setDate(ns.getDate() + 1);
        if (startInp) { startInp.value = ns.toISOString().split('T')[0]; startInp.readOnly = true; startInp.style.background = '#f4f6f8'; }
      } else if (startInp && !follow) {
        startInp.readOnly = false; startInp.style.background = '';
      }
      const startStr = startInp?.value;
      if (startStr) {
        const start = new Date(startStr);
        const end = new Date(start); end.setDate(start.getDate() + days - 1);
        const endEl = row.querySelector('.t-end');
        if (endEl) endEl.textContent = end.toISOString().split('T')[0].replace(/-/g, '/');
        tasks.push({ name, days, color, start, end });
        prevEnd = end;
      }
    } else {
      tasks.push({ name, days, color });
    }
  });

  if (!tasks.length) return;

  if (isDate) {
    renderDateGantt(tasks, sidebar, barsArea, timeline, ganttBody);
  } else {
    renderDaysGantt(tasks, sidebar, barsArea, timeline, ganttBody);
  }
}

function renderDateGantt(tasks, sidebar, barsArea, timeline, ganttBody) {
  const pxD = 2.4;
  const valid = tasks.filter(t => t.start && t.end);
  if (!valid.length) return;

  const minD = new Date(Math.min(...valid.map(t => t.start.getTime())));
  minD.setDate(1); minD.setDate(minD.getDate() - 3);
  const maxD = new Date(Math.max(...valid.map(t => t.end.getTime())));
  maxD.setDate(maxD.getDate() + 12);
  const totalDays = Math.ceil((maxD - minD) / 86400000);
  const totalW = totalDays * pxD;

  timeline.style.width = totalW + 'px';
  ganttBody.style.width = totalW + 'px';
  document.getElementById('ganttGrid').style.backgroundSize = `${pxD * 7}px 100%`;

  for (let i = 0; i <= totalDays; i++) {
    const d = new Date(minD); d.setDate(d.getDate() + i);
    if (d.getDate() === 1) {
      const m = document.createElement('div'); m.className = 'month-mark';
      m.style.left = (i * pxD) + 'px';
      m.textContent = `${d.getFullYear()}/${d.getMonth() + 1}`;
      timeline.appendChild(m);
    }
    if (d.getDate() === 1 || d.getDate() === 15) {
      const dl = document.createElement('div'); dl.className = 'day-mark';
      dl.style.left = (i * pxD) + 'px'; dl.textContent = d.getDate();
      timeline.appendChild(dl);
    }
  }

  valid.forEach(t => {
    const si = document.createElement('div'); si.className = 'sidebar-item'; si.textContent = t.name; si.title = t.name;
    sidebar.appendChild(si);
    const row = document.createElement('div'); row.className = 'gantt-row'; row.style.width = totalW + 'px';
    const offset = Math.ceil((t.start - minD) / 86400000);
    const bar = document.createElement('div'); bar.className = 'task-bar';
    bar.style.left = (offset * pxD) + 'px';
    bar.style.width = Math.max(t.days * pxD, 24) + 'px';
    bar.style.background = t.color;
    bar.textContent = t.days + '天'; bar.title = `${t.name}：${t.days}天`;
    row.appendChild(bar); barsArea.appendChild(row);
  });
}

function renderDaysGantt(tasks, sidebar, barsArea, timeline, ganttBody) {
  const total = tasks.reduce((s, t) => s + t.days, 0);
  if (!total) return;
  const trackW = 600;

  timeline.style.width = trackW + 'px';
  ganttBody.style.width = trackW + 'px';
  document.getElementById('ganttGrid').style.backgroundSize = `${trackW / 10}px 100%`;

  [0, 25, 50, 75, 100].forEach(p => {
    const mk = document.createElement('div'); mk.className = 'pct-mark';
    mk.style.left = (p / 100 * trackW) + 'px';
    mk.textContent = Math.round(total * p / 100) + '天';
    timeline.appendChild(mk);
  });

  let acc = 0;
  tasks.forEach(t => {
    const si = document.createElement('div'); si.className = 'sidebar-item'; si.textContent = t.name; si.title = t.name;
    sidebar.appendChild(si);
    const row = document.createElement('div'); row.className = 'gantt-row'; row.style.width = trackW + 'px';
    const bar = document.createElement('div'); bar.className = 'task-bar';
    bar.style.left = (acc / total * trackW) + 'px';
    bar.style.width = Math.max(t.days / total * trackW, 24) + 'px';
    bar.style.background = t.color;
    bar.textContent = t.days + '天'; bar.title = `${t.name}：${t.days}天`;
    row.appendChild(bar); barsArea.appendChild(row);
    acc += t.days;
  });
}

/* ── 統計欄 ── */
function updateSummary() {
  const proj = projects[activeId];
  const el = document.getElementById('summaryBar');
  if (!el || !proj) return;
  const isDate = proj.mode === 'date';
  const total = (proj.tasks || []).reduce((s, t) => s + (parseInt(t.days) || 0), 0);

  let dateHtml = '';
  if (isDate) {
    dateHtml = `
      <span>開工：<input type="date" id="projStartInp" value="${proj.startDate || ''}" style="border:1px solid #fce08a" oninput="onChange()"></span>
      <span>完工：<input type="date" id="projEndInp" value="${proj.endDate || ''}" style="border:1px solid #fce08a" oninput="onChange()"></span>`;
  }
  el.innerHTML = `<span>項目：<b>${proj.tasks.length}</b></span><span>總工期：<b>${total} 天</b></span>${dateHtml}`;
}

/* ── 選擇器 ── */
function updateSelector() {
  const sel = document.getElementById('projSelect');
  sel.innerHTML = '';
  const keys = Object.keys(projects);
  if (!keys.length) { sel.innerHTML = '<option value="">（尚無工程）</option>'; return; }
  keys.forEach(id => {
    const o = document.createElement('option');
    o.value = id; o.textContent = projects[id].name || '未命名';
    if (id === activeId) o.selected = true;
    sel.appendChild(o);
  });
}

/* ── 匯出 ── */
async function exportFile(type) {
  const target = document.getElementById('captureArea');
  const scroll = document.getElementById('ganttScroll');
  if (!target || !scroll) return;
  const fullW = target.offsetWidth - scroll.offsetWidth + scroll.scrollWidth;
  showLoader(true, '產生圖檔中...');
  try {
    const canvas = await html2canvas(target, {
      scale: 2, useCORS: true, backgroundColor: '#ffffff',
      width: fullW, windowWidth: fullW,
      onclone: cloned => {
        const cs = cloned.getElementById('ganttScroll');
        cs.style.width = scroll.scrollWidth + 'px';
        cs.style.overflow = 'visible';
      }
    });
    if (type === 'jpg') {
      const a = document.createElement('a');
      a.download = (projects[activeId]?.name || '甘特圖') + '.jpg';
      a.href = canvas.toDataURL('image/jpeg', 0.92);
      a.click();
    } else {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [canvas.width / 2, canvas.height / 2] });
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, canvas.width / 2, canvas.height / 2);
      pdf.save((projects[activeId]?.name || '甘特圖') + '.pdf');
    }
  } catch(e) { alert('匯出失敗：' + e.message); }
  finally { showLoader(false); }
}

/* ── 工具 ── */
function showLoader(show, text = '') { const l = document.getElementById('loader'); l.style.display = show ? 'flex' : 'none'; if (text) document.getElementById('loaderText').textContent = text; }
function setStatus(t) { document.getElementById('statusMsg').textContent = t; }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
